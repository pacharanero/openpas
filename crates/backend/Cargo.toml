[package]
name = "openpas-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
helios-fhir = { version = "0.2.4", features = ["R4"] }
helios-persistence = { version = "0.2.4", features = ["postgres"] }
helios-rest = { version = "0.2.4", features = ["R4", "postgres"] }
# Pinned to 0.3.0, not current (2.0.0): nhs-number >=1.0.0 requires
# serde >=1.0.228, which conflicts with helios-fhir's exact serde=1.0.224
# pin. The core API (NHSNumber, FromStr, validate_check_digit, the
# testable module) is unchanged since 0.3.0 - the gap is later safety/test
# refinements, not a different surface. Revisit if either pin loosens.
nhs-number = "=0.3.0"
# Pinned to match helios-fhir's exact (not caret) serde requirement.
serde = { version = "1.0.224", features = ["derive"] }
# Pinned to match helios-fhir's exact (not caret) serde_json requirement.
serde_json = "1.0.144"
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1.5"
