[package]
name = "openpas-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
helios-fhir = { version = "0.2.4", features = ["R4"] }
helios-persistence = { version = "0.2.4", features = ["postgres"] }
helios-rest = { version = "0.2.4", features = ["R4", "postgres"] }
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1.5"
# Pinned to match helios-fhir's exact (not caret) serde_json requirement.
serde_json = "1.0.144"
tower = { version = "0.5.3", features = ["util"] }
