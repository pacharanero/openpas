[package]
name = "openpas-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
# Pinned to match helios-fhir's exact (not caret) serde/serde_json
# requirements - this is one Cargo workspace with crates/backend, so the
# resolver needs one consistent version across every member, even though
# this crate does not depend on helios-fhir itself.
serde = { version = "1.0.224", features = ["derive"] }
serde_json = "1.0.144"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = "0.15.0"

[dev-dependencies]
http-body-util = "0.1.5"
openpas-backend = { path = "../backend" }
tower = { version = "0.5.3", features = ["util"] }
