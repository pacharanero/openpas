<!doctype html>
<html lang="en" data-theme="openpas">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}openpas{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js" defer></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    {% block shell %}
    <div class="drawer min-h-screen lg:drawer-open">
        <input id="app-drawer" type="checkbox" class="drawer-toggle" tabindex="-1" aria-hidden="true">
        <div class="drawer-content flex min-h-screen min-w-0 flex-col">
            <header class="navbar min-h-16 border-b border-base-300 bg-base-100 px-4 sm:px-6">
                <div class="flex-none lg:hidden">
                    <button id="nav-open" type="button" aria-controls="app-navigation" aria-expanded="false" class="btn btn-ghost drawer-button min-h-11">
                        Menu
                    </button>
                </div>
                <div class="flex-1 px-2">
                    <span class="text-sm font-semibold text-base-content/65">Patient Administration</span>
                </div>
                <a href="/logout" class="btn btn-ghost min-h-11">Log out</a>
            </header>
            <main class="flex-1 p-4 sm:p-6 lg:p-8">
                <div class="mx-auto w-full max-w-screen-2xl">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
        <aside class="drawer-side z-20">
            <label for="app-drawer" aria-label="Close navigation" class="drawer-overlay"></label>
            <div id="app-navigation" class="flex min-h-full w-72 flex-col border-r border-base-300 bg-base-100">
                <div class="flex h-16 items-center justify-between border-b border-base-300 px-4 sm:px-6">
                    <a href="/patients" class="text-xl font-bold text-primary no-underline">openpas</a>
                    <button id="nav-close" type="button" class="btn btn-ghost btn-sm lg:hidden" aria-label="Close navigation">Close</button>
                </div>
                <nav class="flex-1 p-4" aria-label="Main navigation">
                    <p class="px-3 pb-2 text-xs font-semibold uppercase text-base-content/50">Patient administration</p>
                    <ul class="menu w-full gap-1 p-0">
                        <li><a href="/patients" class="active font-medium">Patients</a></li>
                        <li><span class="cursor-not-allowed text-base-content/40" aria-disabled="true">Episodes of care <span class="badge badge-ghost badge-sm">Soon</span></span></li>
                        <li><span class="cursor-not-allowed text-base-content/40" aria-disabled="true">Admissions <span class="badge badge-ghost badge-sm">Soon</span></span></li>
                        <li><span class="cursor-not-allowed text-base-content/40" aria-disabled="true">Referrals <span class="badge badge-ghost badge-sm">Soon</span></span></li>
                    </ul>
                </nav>
                <div class="border-t border-base-300 p-4 text-xs text-base-content/55">
                    Demo environment - no real patient data
                </div>
            </div>
        </aside>
    </div>
    {% endblock %}
</body>
</html>
