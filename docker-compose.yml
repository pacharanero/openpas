# Local development Postgres only. Not for production use.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: openpas-dev
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ wants a single mount at the parent dir, not .../data directly.
      - openpas-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openpas-postgres-data:
